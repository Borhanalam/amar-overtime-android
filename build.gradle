plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borhan.amarot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.borhan.amarot'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

